<!doctype html>
<html lang="pl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/favicon.ico" rel="icon" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Naruto Shippuuden</title>
    <style>
      .highlight {
        fill: pink !important;
      }
      html {
        min-height: 100vh;
      }
      hr {
        background: #fff6e5;
      }
      :root {
        background: linear-gradient(
          120deg,
          #fff6e5,
          #ffd8a8,
          #f7bc81,
          #ffd8a8,
          #fff6e5
        );
        background-size: 400% 400%;
        animation: narutoGradient 8s ease-in-out infinite;
      }
      @keyframes narutoGradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="container mt-6 px-4 pb-4">
        <div id="progress-wrapper" style="display: none">
          <h1 class="is-size-3">Progress Naruto</h1>
          <h2 id="last-watched" class="is-size-4"></h2>
          <h3 class="is-size-5">
            W ciągu ostatniego tygodnia obejrzałem
            <span id="in-last-week"></span>
          </h3>
          <hr />
          <div>
            <div style="display: grid; grid-template-columns: 220fr 500fr">
              <div>
                <h3 class="pb-2">
                  <span class="is-hidden-mobile">Obejrzałem</span>
                  100% Naruto
                </h3>
              </div>
              <div>
                <h3 class="pb-2 has-text-right">
                  <span class="is-hidden-mobile">Obejrzałem</span>
                  <span id="percent"></span> Shippuuden
                </h3>
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 220fr 500fr">
              <div>
                <progress
                  title="Progress dla 220 odcinków Naruto"
                  value="220"
                  class="progress is-primary"
                  id="progress-naruto"
                  max="220"
                  style="
                    border-top-right-radius: 0;
                    border-bottom-right-radius: 0;
                  "
                ></progress>
              </div>
              <div>
                <progress
                  title="Progress dla 500 odcinków Naruto Shippuuden"
                  class="progress is-warning"
                  id="progress-shippuuden"
                  max="500"
                  style="
                    border-top-left-radius: 0;
                    border-bottom-left-radius: 0;
                  "
                ></progress>
              </div>
            </div>
            <h3 class="pt-2 has-text-centered">
              <span class="is-hidden-mobile">Obejrzałem</span>
              <span id="percent-all"></span> Naruto + Shippuuden
            </h3>
          </div>
          <hr />
          <div
            style="
              background: #0f172a;
              color: white;
              border-radius: 3px;
              padding: 1rem;
              overflow: hidden;
              max-width: 870px;
              margin-left: auto;
              margin-right: auto;
              min-height: 232px;
            "
          >
            <h3 class="mb-2 has-text-weight-bold">
              Heatmapa odcinków Naruto + Shippuuden
            </h3>
            <div class="mb-3" id="ex-ghDay"></div>
            <div>
              <button class="button is-small" id="heatmap-previous">
                ← Poprzednie
              </button>
              <button class="button is-small" id="heatmap-next">
                Następne →
              </button>
              <div
                id="ex-ghDay-legend"
                style="margin: 0 4px; float: right"
              ></div>
            </div>
          </div>

          <hr />
          <h2 id="last-updated" class="is-size-6"></h2>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
