name: Run Bot

on:
  workflow_dispatch:
  push:
    - branches:
        - main
  schedule:
    - cron: "0 0,5,11,19,23 * * *"
env:
  REFRESH_TOKEN: "${{ secrets.REFRESH_TOKEN }}"
  BLOB_READ_WRITE_TOKEN: "${{ secrets.BLOB_READ_WRITE_TOKEN }}"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --filter @app/feed
      - run: bun test packages/feed
      - run: bun run feed:start
